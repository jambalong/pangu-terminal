name: Uptime

# Backup for the external uptime monitor: pings /up every 10 minutes so the free
# Render instance stays awake (it sleeps after about 15 idle minutes) and a
# failed run emails the repository owner. /up does no database work, so this
# does not use Neon compute. Scheduled runs can be delayed by GitHub; the
# external monitor (5 minute interval) is the primary check.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check /up
        # A cold start can take about a minute, so allow a long first try and retry.
        run: >
          curl --fail --silent --show-error --location
          --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors
          https://panguterminal.ambalong.dev/up
